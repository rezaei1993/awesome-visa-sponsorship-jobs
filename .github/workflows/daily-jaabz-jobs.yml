name: Daily Jaabz jobs

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch jobs
        env:
          JAABZ_CATALOG_URL: ${{ secrets.JAABZ_CATALOG_URL }}
          JAABZ_CATALOG_KEY: ${{ secrets.JAABZ_CATALOG_KEY }}
          JOB_TYPE: visa
          JOB_LIMIT: "20"
        run: python3 scripts/fetch_jaabz_jobs.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DAILY_JOBS.md README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh daily Jaabz jobs"
          git push
